<div class="reading-progress"></div>

<header class="top-header">
  <button class="menu-toggle">目录</button>
  <span class="logo">OpenClaw Docs</span>
  <span class="crumbs"><a href="index.html" style="color:inherit;text-decoration:none;">首页</a> · <strong>搜索</strong></span>

<aside class="sidebar"></aside>

<main class="main">

  <h1 class="doc-title">全文搜索</h1>
  <p class="doc-subtitle">在所有文章标题、摘要、标签中搜索</p>

  <div class="search-box">
 
    <input type="search" placeholder="输入关键词搜索文章..." autofocus>
  </div>

  <div class="search-results"></div>

</main>



<script>
fetch('assets/articles.json')
  .then(r => r.text())
  .then(t => {
    window.OPENCLAW_ARTICLES = JSON.parse(t);
    document.dispatchEvent(new Event('DOMContentLoaded', { bubbles: true }));
  })
  .catch(() => {
    if (window.OPENCLAW_ARTICLES_FALLBACK) {
      window.OPENCLAW_ARTICLES = window.OPENCLAW_ARTICLES_FALLBACK;
      document.dispatchEvent(new Event('DOMContentLoaded', { bubbles: true }));
    }
  });
</script>
</body>
</html>
