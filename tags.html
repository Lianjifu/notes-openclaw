<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>标签 · OpenClaw Docs</title>
<link rel="stylesheet" href="assets/gitbook.css?v=1794028923_a1428">
<script src="assets/site.js?v=1794028923_a1428" defer></script>
<script src="assets/platform.js?v=1794028923_a1428" defer></script>
</head>
<body>

<div class="reading-progress"></div>

<header class="top-header">
  <button class="menu-toggle">目录</button>
  <span class="logo">OpenClaw Docs</span>
  <span class="crumbs"><a href="index.html" style="color:inherit;text-decoration:none;">首页</a> · <strong>标签</strong></span>
  <span class="spacer"></span>
  <a class="theme-toggle" href="search.html" style="text-decoration:none;margin-right:0.4rem;">搜索</a>
  <button class="theme-toggle">暗色</button>
</header>

<aside class="sidebar"></aside>

<main class="main">

  <h1 class="doc-title">标签</h1>
  <p class="doc-subtitle">按标签浏览所有文章</p>

  <h2>标签云</h2>
  <div class="tag-cloud"></div>

  <h2 style="margin-top:2rem;">标签统计</h2>
  <div id="tag-stats"></div>

</main>



<script>
fetch('assets/articles.json')
  .then(r => r.text())
  .then(t => {
    window.OPENCLAW_ARTICLES = JSON.parse(t);
    document.dispatchEvent(new Event('DOMContentLoaded', { bubbles: true }));
    // 渲染详细统计
    const articles = window.OPENCLAW_ARTICLES;
    const counts = {};
    articles.forEach(a => a.tags.forEach(t => { counts[t] = (counts[t] || 0) + 1; }));
    const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    const stats = document.getElementById('tag-stats');
    stats.innerHTML = `
      <table>
        <thead><tr><th>标签</th><th>文章数</th><th>相关文章</th></tr></thead>
        <tbody>
          ${sorted.map(([tag, count]) => {
            const related = articles.filter(a => a.tags.includes(tag)).map(a =>
              `<a href="${a.path}" style="margin-right:0.5rem;color:var(--accent);">${a.title}</a>`
            ).join(' · ');
            return `<tr><td><strong style="color:var(--text-primary);">${tag}</strong></td><td>${count}</td><td style="font-size:0.85rem;">${related}</td></tr>`;
          }).join('')}
        </tbody>
      </table>
    `;
  })
  .catch(() => {
    if (window.OPENCLAW_ARTICLES_FALLBACK) {
      window.OPENCLAW_ARTICLES = window.OPENCLAW_ARTICLES_FALLBACK;
      document.dispatchEvent(new Event('DOMContentLoaded', { bubbles: true }));
    }
  });
</script>
</body>
</html>
